<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 3D Base Platform -->
  <rect x="30" y="160" width="140" height="12" rx="3" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- 3D Communication Hub -->
  <circle cx="100" cy="120" r="30" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- 3D Connection Lines -->
  <path d="M70 120L100 120" stroke="url(#grad2)" stroke-width="3" opacity="0.8"/>
  <path d="M130 120L100 120" stroke="url(#grad2)" stroke-width="3" opacity="0.8"/>
  <path d="M100 90L100 120" stroke="url(#grad2)" stroke-width="3" opacity="0.8"/>
  <path d="M100 150L100 120" stroke="url(#grad2)" stroke-width="3" opacity="0.8"/>
  
  <!-- 3D Connection Nodes -->
  <circle cx="60" cy="120" r="12" fill="url(#grad2)" filter="url(#glow)"/>
  <circle cx="140" cy="120" r="12" fill="url(#grad2)" filter="url(#glow)"/>
  <circle cx="100" cy="80" r="12" fill="url(#grad2)" filter="url(#glow)"/>
  <circle cx="100" cy="160" r="12" fill="url(#grad2)" filter="url(#glow)"/>
  
  <!-- 3D Communication Icons -->
  <text x="60" y="125" text-anchor="middle" fill="white" font-size="8" font-weight="bold">📧</text>
  <text x="140" y="125" text-anchor="middle" fill="white" font-size="8" font-weight="bold">💬</text>
  <text x="100" y="85" text-anchor="middle" fill="white" font-size="8" font-weight="bold">📱</text>
  <text x="100" y="165" text-anchor="middle" fill="white" font-size="8" font-weight="bold">🌐</text>
  
  <!-- 3D Central Hub Icon -->
  <text x="100" y="127" text-anchor="middle" fill="white" font-size="12" font-weight="bold">💬</text>
  
  <!-- 3D Data Flow Particles -->
  <circle cx="70" cy="120" r="3" fill="#F59E0B" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="120" r="3" fill="#10B981" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="100" cy="90" r="3" fill="#EF4444" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="100" cy="150" r="3" fill="#8B5CF6" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- 3D Shadow Effects -->
  <rect x="32" y="162" width="136" height="6" rx="2" fill="rgba(0,0,0,0.1)"/>
  
  <!-- 3D Central Processing -->
  <circle cx="100" cy="120" r="8" fill="white" opacity="0.9">
    <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg> 