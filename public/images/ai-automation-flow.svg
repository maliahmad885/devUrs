<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    
    <linearGradient id="pinkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    
    <!-- Shadows and Effects -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Patterns -->
    <pattern id="gridPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E7EB" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- Background Grid -->
  <rect width="500" height="400" fill="url(#gridPattern)"/>
  
  <!-- Central Hub -->
  <circle cx="250" cy="200" r="80" fill="url(#purpleGradient)" filter="url(#dropShadow)"/>
  <circle cx="250" cy="200" r="70" fill="url(#purpleGradient)" opacity="0.9"/>
  <circle cx="250" cy="200" r="60" fill="url(#purpleGradient)" opacity="0.8"/>
  
  <!-- Central Icon -->
  <circle cx="250" cy="200" r="40" fill="white" opacity="0.95"/>
  <circle cx="250" cy="200" r="35" fill="url(#purpleGradient)" opacity="0.1"/>
  
  <!-- AI Brain Symbol in Center -->
  <path d="M235 185 Q250 175 265 185 Q250 195 235 205 Q250 215 265 205" 
        stroke="url(#purpleGradient)" stroke-width="3" fill="none"/>
  <path d="M230 190 Q250 180 270 190 Q250 200 230 210 Q250 220 270 210" 
        stroke="url(#purpleGradient)" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- Orbiting Process Nodes -->
  <!-- Top Left - Data Processing -->
  <g transform="translate(120, 80)">
    <rect x="-30" y="-30" width="60" height="60" rx="12" fill="url(#blueGradient)" filter="url(#dropShadow)"/>
    <rect x="-25" y="-25" width="50" height="50" rx="8" fill="url(#blueGradient)" opacity="0.8"/>
    <circle cx="0" cy="0" r="15" fill="white" opacity="0.9"/>
    <path d="M-8 -8 L8 8 M-8 8 L8 -8" stroke="url(#blueGradient)" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- Top Right - AI Learning -->
  <g transform="translate(380, 80)">
    <polygon points="-25,-25 25,-25 0,25" fill="url(#greenGradient)" filter="url(#dropShadow)"/>
    <polygon points="-20,-20 20,-20 0,20" fill="url(#greenGradient)" opacity="0.8"/>
    <circle cx="0" cy="0" r="12" fill="white" opacity="0.9"/>
    <path d="M0 -8 L0 8 M-6 0 L6 0" stroke="url(#greenGradient)" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- Bottom Left - Automation -->
  <g transform="translate(120, 320)">
    <ellipse cx="0" cy="0" rx="35" ry="25" fill="url(#orangeGradient)" filter="url(#dropShadow)"/>
    <ellipse cx="0" cy="0" rx="28" ry="20" fill="url(#orangeGradient)" opacity="0.8"/>
    <rect x="-8" y="-8" width="16" height="16" fill="white" opacity="0.9"/>
    <path d="M-4 -4 L4 4 M-4 4 L4 -4" stroke="url(#orangeGradient)" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- Bottom Right - Integration -->
  <g transform="translate(380, 320)">
    <rect x="-30" y="-25" width="60" height="50" rx="8" fill="url(#pinkGradient)" filter="url(#dropShadow)"/>
    <rect x="-25" y="-20" width="50" height="40" rx="6" fill="url(#pinkGradient)" opacity="0.8"/>
    <circle cx="0" cy="0" r="12" fill="white" opacity="0.9"/>
    <path d="M-8 0 L8 0 M0 -8 L0 8" stroke="url(#pinkGradient)" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- Connection Lines with Animation Dots -->
  <g opacity="0.7">
    <!-- Top Left Connection -->
    <line x1="150" y1="110" x2="200" y2="160" stroke="url(#blueGradient)" stroke-width="3" stroke-dasharray="8,8"/>
    <circle cx="175" cy="135" r="3" fill="url(#blueGradient)" opacity="0.8"/>
    
    <!-- Top Right Connection -->
    <line x1="350" y1="110" x2="300" y2="160" stroke="url(#greenGradient)" stroke-width="3" stroke-dasharray="8,8"/>
    <circle cx="325" cy="135" r="3" fill="url(#greenGradient)" opacity="0.8"/>
    
    <!-- Bottom Left Connection -->
    <line x1="150" y1="290" x2="200" y2="240" stroke="url(#orangeGradient)" stroke-width="3" stroke-dasharray="8,8"/>
    <circle cx="175" cy="265" r="3" fill="url(#orangeGradient)" opacity="0.8"/>
    
    <!-- Bottom Right Connection -->
    <line x1="350" y1="290" x2="300" y2="240" stroke="url(#pinkGradient)" stroke-width="3" stroke-dasharray="8,8"/>
    <circle cx="325" cy="265" r="3" fill="url(#pinkGradient)" opacity="0.8"/>
  </g>
  
  <!-- Floating Data Particles -->
  <g opacity="0.6">
    <circle cx="80" cy="60" r="2" fill="url(#blueGradient)"/>
    <circle cx="420" cy="70" r="2.5" fill="url(#greenGradient)"/>
    <circle cx="70" cy="340" r="2" fill="url(#orangeGradient)"/>
    <circle cx="430" cy="330" r="2.5" fill="url(#pinkGradient)"/>
    <circle cx="50" cy="200" r="2" fill="url(#purpleGradient)"/>
    <circle cx="450" cy="200" r="2" fill="url(#purpleGradient)"/>
    <circle cx="150" cy="50" r="2" fill="url(#blueGradient)"/>
    <circle cx="350" cy="50" r="2" fill="url(#greenGradient)"/>
    <circle cx="150" cy="350" r="2" fill="url(#orangeGradient)"/>
    <circle cx="350" cy="350" r="2" fill="url(#pinkGradient)"/>
  </g>
  
  <!-- Energy Flow Waves -->
  <g opacity="0.5" filter="url(#glow)">
    <path d="M250 120 Q270 115 290 120 Q310 125 330 120" 
          stroke="url(#purpleGradient)" stroke-width="2" fill="none"/>
    <path d="M250 280 Q270 285 290 280 Q310 275 330 280" 
          stroke="url(#purpleGradient)" stroke-width="2" fill="none"/>
    <path d="M170 200 Q190 195 210 200 Q230 205 250 200" 
          stroke="url(#purpleGradient)" stroke-width="2" fill="none"/>
    <path d="M250 200 Q270 205 290 200 Q310 195 330 200" 
          stroke="url(#purpleGradient)" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Process Labels -->
  <text x="120" y="160" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="600">
    Data Processing
  </text>
  <text x="380" y="160" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="600">
    AI Learning
  </text>
  <text x="120" y="360" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="600">
    Automation
  </text>
  <text x="380" y="360" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="12" font-weight="600">
    Integration
  </text>
  
  <!-- Central Label -->
  <text x="250" y="320" text-anchor="middle" fill="#374151" font-family="Arial, sans-serif" font-size="14" font-weight="700">
    AI Hub
  </text>
</svg> 