<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="28" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Main Zap Icon -->
  <path d="M32 8L20 32H28L16 56L32 32H24L32 8Z" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Lightning Bolt Details -->
  <path d="M28 32L20 32L32 8L32 16L40 16L32 40L32 32Z" fill="url(#grad1)" opacity="0.7"/>
  
  <!-- Sparkle Effects -->
  <circle cx="20" cy="20" r="2" fill="#F59E0B" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="44" r="1.5" fill="#10B981" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg> 