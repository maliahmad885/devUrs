<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="28" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Brain/Neural Network -->
  <path d="M32 12C24 12 18 18 18 26C18 34 24 40 32 40C40 40 46 34 46 26C46 18 40 12 32 12Z" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Neural Connections -->
  <path d="M20 20L28 28M36 28L44 20M20 32L28 24M36 24L44 32" stroke="url(#grad1)" stroke-width="2" opacity="0.8"/>
  
  <!-- Data Nodes -->
  <circle cx="20" cy="20" r="3" fill="#10B981"/>
  <circle cx="44" cy="20" r="3" fill="#F59E0B"/>
  <circle cx="20" cy="32" r="3" fill="#EF4444"/>
  <circle cx="44" cy="32" r="3" fill="#8B5CF6"/>
  <circle cx="32" cy="26" r="4" fill="url(#grad1)"/>
  
  <!-- Processing Indicators -->
  <circle cx="32" cy="26" r="2" fill="white" opacity="0.9">
    <animate attributeName="r" values="2;3;2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- AI Processing Waves -->
  <path d="M32 44C32 44 30 46 28 46C26 46 24 44 24 42" stroke="url(#grad1)" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M32 44C32 44 34 46 36 46C38 46 40 44 40 42" stroke="url(#grad1)" stroke-width="2" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
</svg> 