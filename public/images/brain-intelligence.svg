<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="28" fill="url(#grad1)" opacity="0.1"/>
  
  <!-- Brain Structure -->
  <path d="M32 16C24 16 18 22 18 30C18 38 24 44 32 44C40 44 46 38 46 30C46 22 40 16 32 16Z" fill="url(#grad1)" filter="url(#glow)"/>
  
  <!-- Brain Folds -->
  <path d="M22 24C22 24 26 26 32 26C38 26 42 24 42 24" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <path d="M22 28C22 28 26 30 32 30C38 30 42 28 42 28" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <path d="M22 32C22 32 26 34 32 34C38 34 42 32 42 32" stroke="white" stroke-width="1.5" opacity="0.8"/>
  <path d="M22 36C22 36 26 38 32 38C38 38 42 36 42 36" stroke="white" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Neural Connections -->
  <path d="M26 20L30 24M38 24L42 20M26 28L30 32M38 32L42 28" stroke="url(#grad1)" stroke-width="1" opacity="0.6"/>
  
  <!-- Intelligence Sparks -->
  <circle cx="20" cy="18" r="2" fill="#F59E0B">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="44" cy="18" r="2" fill="#10B981">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="20" cy="42" r="2" fill="#EF4444">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle cx="44" cy="42" r="2" fill="#8B5CF6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- Central Intelligence Core -->
  <circle cx="32" cy="30" r="3" fill="white" opacity="0.9">
    <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg> 