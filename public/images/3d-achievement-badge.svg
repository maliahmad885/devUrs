<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0891B2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E7490;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B45309;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D1D5DB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9CA3AF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Enhanced Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feComposite in="SourceGraphic" in2="coloredBlur" operator="over"/>
    </filter>
    
    <!-- Patterns -->
    <pattern id="gridPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(139, 92, 246, 0.1)" stroke-width="0.5"/>
    </pattern>
    
    <!-- Star Pattern -->
    <pattern id="starPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0L24 12L36 12L28 20L32 32L20 24L8 32L12 20L4 12L16 12Z" fill="rgba(139, 92, 246, 0.1)"/>
    </pattern>
  </defs>
  
  <!-- Background Grid -->
  <rect width="200" height="200" fill="url(#gridPattern)" opacity="0.2"/>
  
  <!-- Badge Background with 3D Effect -->
  <circle cx="100" cy="100" r="70" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  <circle cx="100" cy="100" r="65" fill="url(#primaryGrad)" opacity="0.9"/>
  <circle cx="100" cy="100" r="60" fill="url(#primaryGrad)" opacity="0.7"/>
  
  <!-- Badge Inner Ring -->
  <circle cx="100" cy="100" r="55" fill="white" opacity="0.95"/>
  <circle cx="100" cy="100" r="50" fill="url(#primaryGrad)" opacity="0.8"/>
  <circle cx="100" cy="100" r="45" fill="white" opacity="0.9"/>
  
  <!-- Central Achievement Symbol -->
  <circle cx="100" cy="100" r="35" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="30" fill="url(#goldGrad)" opacity="0.9"/>
  <circle cx="100" cy="100" r="25" fill="white" opacity="0.95"/>
  
  <!-- Star Achievement Icon -->
  <path d="M100 80L110 95L125 95L115 105L120 120L100 110L80 120L85 105L75 95L90 95Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M100 82L108 94L118 94L110 104L114 116L100 108L86 116L90 104L82 94L92 94Z" fill="white" opacity="0.8"/>
  
  <!-- Achievement Text -->
  <text x="100" y="140" text-anchor="middle" fill="#8B5CF6" font-size="10" font-weight="bold" font-family="Arial, sans-serif">EXCELLENCE</text>
  <text x="100" y="155" text-anchor="middle" fill="#6D28D9" font-size="8" font-weight="bold" font-family="Arial, sans-serif">2024</text>
  
  <!-- Decorative Elements -->
  <!-- Top Crown -->
  <path d="M70 50L100 30L130 50L120 60L110 55L100 60L90 55L80 60Z" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M70 50L100 30L130 50L120 60L110 55L100 60L90 55L80 60Z" fill="url(#goldGrad)" opacity="0.7"/>
  
  <!-- Crown Jewels -->
  <circle cx="85" cy="55" r="3" fill="url(#accentGrad)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="50" r="4" fill="url(#secondaryGrad)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="115" cy="55" r="3" fill="url(#accentGrad)" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <!-- Side Ribbons -->
  <path d="M30 80L50 70L60 80L50 90L40 85L30 90Z" fill="url(#accentGrad)" opacity="0.8"/>
  <path d="M170 80L150 70L140 80L150 90L160 85L170 90Z" fill="url(#accentGrad)" opacity="0.8"/>
  
  <!-- Ribbon Details -->
  <path d="M30 80L50 70L60 80L50 90L40 85L30 90Z" fill="url(#accentGrad)" opacity="0.6"/>
  <path d="M170 80L150 70L140 80L150 90L160 85L170 90Z" fill="url(#accentGrad)" opacity="0.6"/>
  
  <!-- Floating Achievement Particles -->
  <circle cx="40" cy="40" r="3" fill="url(#goldGrad)" opacity="0.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="160" cy="40" r="3" fill="url(#accentGrad)" opacity="0.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="40" cy="160" r="3" fill="url(#secondaryGrad)" opacity="0.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="160" cy="160" r="3" fill="url(#goldGrad)" opacity="0.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Central Achievement Pulse -->
  <circle cx="100" cy="100" r="35" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="35;45;35" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Outer Achievement Pulse -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="url(#primaryGrad)" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="70;80;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Performance Indicators -->
  <rect x="75" y="170" width="50" height="8" rx="4" fill="url(#accentGrad)" opacity="0.8">
    <animate attributeName="width" values="50;60;50" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Achievement Level Indicator -->
  <circle cx="100" cy="190" r="8" fill="url(#goldGrad)" opacity="0.9">
    <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Enhanced Shadow Effects -->
  <ellipse cx="100" cy="195" rx="70" ry="6" fill="rgba(0,0,0,0.15)"/>
  <ellipse cx="100" cy="193" rx="65" ry="4" fill="rgba(0,0,0,0.1)"/>
  
  <!-- Connection Status Indicators -->
  <circle cx="100" cy="100" r="3" fill="white" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Achievement Sparkles -->
  <path d="M100 30L102 25L105 30L100 28L95 30L98 25Z" fill="url(#goldGrad)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="transform" values="rotate(0);rotate(180);rotate(360)" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <path d="M100 170L102 165L105 170L100 168L95 170L98 165Z" fill="url(#accentGrad)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="transform" values="rotate(0);rotate(180);rotate(360)" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Side Achievement Indicators -->
  <path d="M30 100L25 98L30 95L28 100L30 105L32 100Z" fill="url(#secondaryGrad)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  
  <path d="M170 100L175 98L170 95L172 100L170 105L168 100Z" fill="url(#secondaryGrad)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </path>
</svg> 