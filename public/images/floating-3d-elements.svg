<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0891B2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E7490;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B45309;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#DB2777;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BE185D;stop-opacity:1" />
    </linearGradient>
    
    <!-- Enhanced Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
    
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feComposite in="SourceGraphic" in2="coloredBlur" operator="over"/>
    </filter>
    
    <!-- Patterns -->
    <pattern id="gridPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(139, 92, 246, 0.1)" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background Grid -->
  <rect width="200" height="200" fill="url(#gridPattern)" opacity="0.2"/>
  
  <!-- Central Floating Hub -->
  <circle cx="100" cy="100" r="25" fill="url(#primaryGrad)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="20" fill="url(#primaryGrad)" opacity="0.9"/>
  <circle cx="100" cy="100" r="15" fill="white" opacity="0.8"/>
  
  <!-- Central Core -->
  <circle cx="100" cy="100" r="12" fill="url(#primaryGrad)" opacity="0.8"/>
  <circle cx="100" cy="100" r="8" fill="white" opacity="0.9"/>
  
  <!-- Orbiting Elements -->
  <!-- Top Element - Cube -->
  <g transform="translate(100, 60)">
    <rect x="-8" y="-8" width="16" height="16" rx="2" fill="url(#secondaryGrad)" filter="url(#glow)">
      <animate attributeName="transform" values="rotate(0);rotate(360)" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="-6" y="-6" width="12" height="12" rx="1" fill="url(#secondaryGrad)" opacity="0.8"/>
    <rect x="-4" y="-4" width="8" height="8" rx="1" fill="white" opacity="0.7"/>
  </g>
  
  <!-- Right Element - Diamond -->
  <g transform="translate(140, 100)">
    <path d="M0 -10L10 0L0 10L-10 0Z" fill="url(#accentGrad)" filter="url(#glow)">
      <animate attributeName="transform" values="rotate(0);rotate(360)" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M0 -8L8 0L0 8L-8 0Z" fill="url(#accentGrad)" opacity="0.8"/>
    <path d="M0 -6L6 0L0 6L-6 0Z" fill="white" opacity="0.7"/>
  </g>
  
  <!-- Bottom Element - Hexagon -->
  <g transform="translate(100, 140)">
    <path d="M0 -10L8.66 -5L8.66 5L0 10L-8.66 5L-8.66 -5Z" fill="url(#goldGrad)" filter="url(#glow)">
      <animate attributeName="transform" values="rotate(0);rotate(360)" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M0 -8L6.93 -4L6.93 4L0 8L-6.93 4L-6.93 -4Z" fill="url(#goldGrad)" opacity="0.8"/>
    <path d="M0 -6L5.2 -3L5.2 3L0 6L-5.2 3L-5.2 -3Z" fill="white" opacity="0.7"/>
  </g>
  
  <!-- Left Element - Triangle -->
  <g transform="translate(60, 100)">
    <path d="M-10 8.66L10 8.66L0 -8.66Z" fill="url(#pinkGrad)" filter="url(#glow)">
      <animate attributeName="transform" values="rotate(0);rotate(360)" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M-8 6.93L8 6.93L0 -6.93Z" fill="url(#pinkGrad)" opacity="0.8"/>
    <path d="M-6 5.2L6 5.2L0 -5.2Z" fill="white" opacity="0.7"/>
  </g>
  
  <!-- Diagonal Elements -->
  <!-- Top Left - Star -->
  <g transform="translate(70, 70)">
    <path d="M0 -8L2.5 -2.5L8 0L2.5 2.5L0 8L-2.5 2.5L-8 0L-2.5 -2.5Z" fill="url(#secondaryGrad)" filter="url(#glow)">
      <animate attributeName="transform" values="rotate(0);rotate(360)" dur="15s" repeatCount="indefinite"/>
    </path>
    <path d="M0 -6L2 -1.5L6 0L2 1.5L0 6L-2 1.5L-6 0L-2 -1.5Z" fill="url(#secondaryGrad)" opacity="0.8"/>
  </g>
  
  <!-- Top Right - Octagon -->
  <g transform="translate(130, 70)">
    <path d="M0 -8L5.66 -5.66L8 0L5.66 5.66L0 8L-5.66 5.66L-8 0L-5.66 -5.66Z" fill="url(#accentGrad)" filter="url(#glow)">
      <animate attributeName="transform" values="rotate(0);rotate(360)" dur="18s" repeatCount="indefinite"/>
    </path>
    <path d="M0 -6L4.24 -4.24L6 0L4.24 4.24L0 6L-4.24 4.24L-6 0L-4.24 -4.24Z" fill="url(#accentGrad)" opacity="0.8"/>
  </g>
  
  <!-- Bottom Left - Cross -->
  <g transform="translate(70, 130)">
    <rect x="-8" y="-2" width="16" height="4" rx="2" fill="url(#goldGrad)" filter="url(#glow)">
      <animate attributeName="transform" values="rotate(0);rotate(360)" dur="20s" repeatCount="indefinite"/>
    </rect>
    <rect x="-2" y="-8" width="4" height="16" rx="2" fill="url(#goldGrad)" filter="url(#glow)"/>
    <rect x="-6" y="-1" width="12" height="2" rx="1" fill="url(#goldGrad)" opacity="0.8"/>
    <rect x="-1" y="-6" width="2" height="12" rx="1" fill="url(#goldGrad)" opacity="0.8"/>
  </g>
  
  <!-- Bottom Right - Circle with Inner Elements -->
  <g transform="translate(130, 130)">
    <circle cx="0" cy="0" r="8" fill="url(#pinkGrad)" filter="url(#glow)">
      <animate attributeName="transform" values="rotate(0);rotate(360)" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="url(#pinkGrad)" opacity="0.8"/>
    <circle cx="0" cy="0" r="4" fill="white" opacity="0.7"/>
    <circle cx="0" cy="0" r="2" fill="url(#pinkGrad)" opacity="0.9"/>
  </g>
  
  <!-- Enhanced Connection Lines with Glow -->
  <path d="M100 75L100 85" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <path d="M125 100L115 100" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <path d="M100 125L100 115" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  <path d="M75 100L85 100" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.6" filter="url(#glow)"/>
  
  <!-- Diagonal Connections -->
  <path d="M78 78L85 85" stroke="url(#primaryGrad)" stroke-width="1" opacity="0.4" filter="url(#glow)"/>
  <path d="M122 78L115 85" stroke="url(#primaryGrad)" stroke-width="1" opacity="0.4" filter="url(#glow)"/>
  <path d="M78 122L85 115" stroke="url(#primaryGrad)" stroke-width="1" opacity="0.4" filter="url(#glow)"/>
  <path d="M122 122L115 115" stroke="url(#primaryGrad)" stroke-width="1" opacity="0.4" filter="url(#glow)"/>
  
  <!-- Data Flow Indicators -->
  <path d="M100 75L100 85" stroke="url(#secondaryGrad)" stroke-width="1" opacity="0.6" stroke-dasharray="2,2">
    <animate attributeName="stroke-dashoffset" values="0;4;0" dur="2s" repeatCount="indefinite"/>
  </path>
  
  <path d="M125 100L115 100" stroke="url(#accentGrad)" stroke-width="1" opacity="0.6" stroke-dasharray="2,2">
    <animate attributeName="stroke-dashoffset" values="0;4;0" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </path>
  
  <path d="M100 125L100 115" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" stroke-dasharray="2,2">
    <animate attributeName="stroke-dashoffset" values="0;4;0" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  
  <path d="M75 100L85 100" stroke="url(#pinkGrad)" stroke-width="1" opacity="0.6" stroke-dasharray="2,2">
    <animate attributeName="stroke-dashoffset" values="0;4;0" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </path>
  
  <!-- Floating Data Particles -->
  <circle cx="40" cy="40" r="3" fill="url(#secondaryGrad)" opacity="0.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="160" cy="40" r="3" fill="url(#accentGrad)" opacity="0.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="40" cy="160" r="3" fill="url(#goldGrad)" opacity="0.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="160" cy="160" r="3" fill="url(#pinkGrad)" opacity="0.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Central Processing Pulse -->
  <circle cx="100" cy="100" r="15" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="15;25;15" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Element Pulse Effects -->
  <circle cx="100" cy="60" r="20" fill="none" stroke="url(#secondaryGrad)" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="20;25;20" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="140" cy="100" r="20" fill="none" stroke="url(#accentGrad)" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="20;25;20" dur="4s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="140" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="20;25;20" dur="4s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="60" cy="100" r="20" fill="none" stroke="url(#pinkGrad)" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="20;25;20" dur="4s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Performance Indicators -->
  <rect x="85" y="180" width="30" height="6" rx="3" fill="url(#accentGrad)" opacity="0.8">
    <animate attributeName="width" values="30;40;30" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="85" y="190" width="20" height="6" rx="3" fill="url(#goldGrad)" opacity="0.8">
    <animate attributeName="width" values="20;30;20" dur="2.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Enhanced Shadow Effects -->
  <ellipse cx="100" cy="195" rx="25" ry="4" fill="rgba(0,0,0,0.1)"/>
  <ellipse cx="100" cy="193" rx="22" ry="3" fill="rgba(0,0,0,0.05)"/>
  
  <!-- Connection Status Indicators -->
  <circle cx="100" cy="100" r="3" fill="white" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Element Activity Indicators -->
  <circle cx="100" cy="60" r="2" fill="white" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="140" cy="100" r="2" fill="white" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  
  <circle cx="100" cy="140" r="2" fill="white" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <circle cx="60" cy="100" r="2" fill="white" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
</svg> 