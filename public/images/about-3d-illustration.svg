<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6D28D9;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="secondaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0891B2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E7490;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B45309;stop-opacity:1" />
    </linearGradient>
    
    <!-- Enhanced Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
    
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feComposite in="SourceGraphic" in2="coloredBlur" operator="over"/>
    </filter>
    
    <!-- Patterns -->
    <pattern id="grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(139, 92, 246, 0.1)" stroke-width="0.5"/>
    </pattern>
  </defs>
  
  <!-- Background Grid Pattern -->
  <rect width="400" height="400" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Enhanced 3D Base Platform with Depth -->
  <rect x="60" y="320" width="280" height="24" rx="6" fill="url(#primaryGrad)" filter="url(#shadow)"/>
  <rect x="60" y="320" width="280" height="24" rx="6" fill="url(#primaryGrad)" opacity="0.8"/>
  <rect x="64" y="324" width="272" height="16" rx="4" fill="url(#primaryGrad)" opacity="0.6"/>
  
  <!-- Central AI Hub with Enhanced 3D Effect -->
  <circle cx="200" cy="240" r="40" fill="url(#primaryGrad)" filter="url(#glow)"/>
  <circle cx="200" cy="240" r="35" fill="url(#primaryGrad)" opacity="0.9"/>
  <circle cx="200" cy="240" r="30" fill="url(#primaryGrad)" opacity="0.7"/>
  
  <!-- Central AI Core -->
  <circle cx="200" cy="240" r="20" fill="white" opacity="0.95"/>
  <circle cx="200" cy="240" r="18" fill="url(#primaryGrad)" opacity="0.8"/>
  <circle cx="200" cy="240" r="15" fill="white" opacity="0.9"/>
  
  <!-- AI Text with Better Typography -->
  <text x="200" y="245" text-anchor="middle" fill="#8B5CF6" font-size="14" font-weight="bold" font-family="Arial, sans-serif">AI</text>
  
  <!-- Enhanced Satellite Nodes with 3D Depth -->
  <!-- n8n Node -->
  <circle cx="120" cy="160" r="20" fill="url(#secondaryGrad)" filter="url(#glow)"/>
  <circle cx="120" cy="160" r="18" fill="url(#secondaryGrad)" opacity="0.9"/>
  <circle cx="120" cy="160" r="15" fill="url(#secondaryGrad)" opacity="0.7"/>
  <text x="120" y="165" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="Arial, sans-serif">n8n</text>
  
  <!-- Make Node -->
  <circle cx="280" cy="160" r="20" fill="url(#secondaryGrad)" filter="url(#glow)"/>
  <circle cx="280" cy="160" r="18" fill="url(#secondaryGrad)" opacity="0.9"/>
  <circle cx="280" cy="160" r="15" fill="url(#secondaryGrad)" opacity="0.7"/>
  <text x="280" y="165" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Make</text>
  
  <!-- CRM Node -->
  <circle cx="120" cy="320" r="20" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="120" cy="320" r="18" fill="url(#accentGrad)" opacity="0.9"/>
  <circle cx="120" cy="320" r="15" fill="url(#accentGrad)" opacity="0.7"/>
  <text x="120" y="325" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="Arial, sans-serif">CRM</text>
  
  <!-- Voice Node -->
  <circle cx="280" cy="320" r="20" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="280" cy="320" r="18" fill="url(#accentGrad)" opacity="0.9"/>
  <circle cx="280" cy="320" r="15" fill="url(#accentGrad)" opacity="0.7"/>
  <text x="280" y="325" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="Arial, sans-serif">Voice</text>
  
  <!-- Enhanced Connection Lines with Glow -->
  <path d="M140 170L170 220" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.8" filter="url(#glow)"/>
  <path d="M260 170L230 220" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.8" filter="url(#glow)"/>
  <path d="M140 310L170 260" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.8" filter="url(#glow)"/>
  <path d="M260 310L230 260" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.8" filter="url(#glow)"/>
  
  <!-- Data Flow Indicators -->
  <path d="M200 200L200 220" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.6" filter="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M200 260L200 280" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.6" filter="url(#glow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
  </path>
  
  <!-- Enhanced Floating Particles with Better Animation -->
  <circle cx="80" cy="120" r="4" fill="url(#goldGrad)" opacity="0.9" filter="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6;4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="320" cy="120" r="4" fill="url(#accentGrad)" opacity="0.9" filter="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="r" values="4;6;4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="80" cy="280" r="4" fill="url(#secondaryGrad)" opacity="0.9" filter="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="r" values="4;6;4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="320" cy="280" r="4" fill="url(#goldGrad)" opacity="0.9" filter="url(#glow)">
    <animate attributeName="opacity" values="0.9;0.2;0.9" dur="4s" repeatCount="indefinite" begin="3s"/>
    <animate attributeName="r" values="4;6;4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Additional Floating Elements -->
  <circle cx="200" cy="80" r="3" fill="url(#primaryGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;75;80" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="200" cy="360" r="3" fill="url(#accentGrad)" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.3;0.7" dur="3s" repeatCount="indefinite" begin="1.5s"/>
    <animate attributeName="cy" values="360;365;360" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Enhanced Shadow Effects -->
  <ellipse cx="200" cy="344" rx="140" ry="8" fill="rgba(0,0,0,0.1)"/>
  <ellipse cx="200" cy="342" rx="136" ry="6" fill="rgba(0,0,0,0.05)"/>
  
  <!-- Central Processing Pulse -->
  <circle cx="200" cy="240" r="25" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="25;35;25" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Connection Pulse Effects -->
  <circle cx="120" cy="160" r="25" fill="none" stroke="url(#secondaryGrad)" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="25;35;25" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="280" cy="160" r="25" fill="none" stroke="url(#secondaryGrad)" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="25;35;25" dur="4s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Performance Indicators -->
  <rect x="160" y="180" width="80" height="8" rx="4" fill="url(#accentGrad)" opacity="0.8">
    <animate attributeName="width" values="80;100;80" dur="2s" repeatCount="indefinite"/>
  </rect>
  
  <rect x="160" y="200" width="60" height="8" rx="4" fill="url(#goldGrad)" opacity="0.8">
    <animate attributeName="width" values="60;80;60" dur="2.5s" repeatCount="indefinite"/>
  </rect>
</svg> 