<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#eff6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Background Pattern -->
  <circle cx="200" cy="150" r="80" fill="rgba(139, 92, 246, 0.1)"/>
  <circle cx="1000" cy="480" r="120" fill="rgba(59, 130, 246, 0.1)"/>
  <circle cx="800" cy="100" r="60" fill="rgba(16, 185, 129, 0.1)"/>
  
  <!-- Main Logo -->
  <rect x="500" y="200" width="80" height="80" rx="20" fill="url(#text)"/>
  <path d="M520 240 L540 220 L560 240 L540 260 Z" fill="white"/>
  
  <!-- Company Name -->
  <text x="600" y="250" font-family="Inter, sans-serif" font-size="48" font-weight="bold" fill="url(#text)">
    Nexus Bloom
  </text>
  
  <!-- Tagline -->
  <text x="600" y="300" font-family="Inter, sans-serif" font-size="24" fill="#6B7280" text-anchor="middle">
    Integration Hub | Connect Everything
  </text>
  
  <!-- Description -->
  <text x="600" y="350" font-family="Inter, sans-serif" font-size="18" fill="#6B7280" text-anchor="middle">
    Seamlessly integrate with 500+ apps and services
  </text>
  
  <!-- Decorative Elements -->
  <circle cx="150" cy="500" r="4" fill="#8B5CF6"/>
  <circle cx="1050" cy="200" r="3" fill="#3B82F6"/>
  <circle cx="900" cy="550" r="5" fill="#10B981"/>
</svg> 